<div class="login-container">

  <div class="login-card">

    <div class="login-header">

      <img
        class="logo-yavirac"
        src="https://yavirac.edu.ec/wp-content/uploads/2026/01/logo-Yavirac-actualizado.png"
        alt="Logo Instituto Yavirac">

      <h1>Sistema de Control de Asistencia</h1>

      <p>
        Instituto Superior Tecnológico Yavirac
      </p>

    </div>

    <form
      [formGroup]="loginForm"
      (ngSubmit)="onSubmit()">

      <mat-form-field appearance="outline">

        <mat-label>Correo institucional</mat-label>

        <input
          matInput
          type="email"
          formControlName="correo"
          placeholder="correo@institucion.edu.ec">

        <mat-error *ngIf="loginForm.get('correo')?.hasError('required')">
          El correo institucional es obligatorio
        </mat-error>

        <mat-error *ngIf="loginForm.get('correo')?.hasError('email')">
          Ingrese un correo válido
        </mat-error>

      </mat-form-field>

      <mat-form-field appearance="outline">

        <mat-label>Contraseña</mat-label>

        <input
          matInput
          [type]="hidePassword ? 'password' : 'text'"
          formControlName="password">

        <button
          mat-icon-button
          matSuffix
          type="button"
          (click)="hidePassword = !hidePassword">

          <mat-icon>
            {{ hidePassword ? 'visibility' : 'visibility_off' }}
          </mat-icon>

        </button>

        <mat-error *ngIf="loginForm.get('password')?.hasError('required')">
          La contraseña es obligatoria
        </mat-error>

        <mat-error *ngIf="loginForm.get('password')?.hasError('minlength')">
          La contraseña debe tener al menos 8 caracteres
        </mat-error>

      </mat-form-field>

      <button
        mat-raised-button
        color="primary"
        type="submit"
        [disabled]="loginForm.invalid">

        Ingresar

      </button>

    </form>

  </div>

</div>
